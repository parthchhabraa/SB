name: Design preview

# Builds the static design preview and publishes it to GitHub Pages.
# The application itself is server rendered and cannot run on Pages; this is
# the preview harness in preview/, which compiles the real components against
# fixture data so the UI can be reviewed without a backend.

on:
  push:
    branches:
      - main
      - claude/study-tracker-build-hbf20c
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build preview
        run: npm run preview:build
        env:
          PREVIEW_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on the first time this runs, so there is no manual
          # settings step before the first deploy.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
